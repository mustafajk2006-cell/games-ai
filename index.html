<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamz AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#1f2937;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
padding:12px;
margin:10px 0;
border-radius:12px;
max-width:80%;
word-wrap:break-word;
}

.user{
background:#2563eb;
margin-left:auto;
}

.ai{
background:#374151;
margin-right:auto;
}

.bottom{
display:flex;
gap:10px;
padding:10px;
background:#1f2937;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
}

button{
padding:12px 18px;
background:#10b981;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
</style>
</head>

<body>

<header>🤖 Gamz AI</header>

<div id="chat">
<div class="msg ai">
هلا بيك! أني Gamz AI 😎
</div>
</div>

<div class="bottom">
<input id="text" placeholder="اكتب رسالتك...">
<button onclick="send()">إرسال</button>
</div>

<script>
const input = document.getElementById("text");

input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        send();
    }
});

function send(){

    if(input.value.trim() === "") return;

    const chat = document.getElementById("chat");
    const message = input.value;

    chat.innerHTML += 
        <div class="msg user">
            ${message}
        </div>
    ;

    chat.scrollTop = chat.scrollHeight;

    input.value = "";

    fetch("https://gamz-ai.haidders09.workers.dev/", {
        method: "POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            message:message
        })
    })
    .then(res => res.json())
    .then(data => {

        chat.innerHTML += 
            <div class="msg ai">
                ${data.reply || "ما وصل رد من السيرفر."}
            </div>
        ;

        chat.scrollTop = chat.scrollHeight;

    })
    .catch(() => {

        chat.innerHTML += 
            <div class="msg ai">
                صار خطأ بالاتصال 😅
            </div>
        ;

        chat.scrollTop = chat.scrollHeight;
    });
}
</script>

</body>
</html>
